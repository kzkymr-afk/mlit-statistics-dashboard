name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-mlit-statistics
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Download the published item registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public
          gh release download data-current \
            --pattern 'system-pages-data.tar.gz' \
            --dir public
          tar -xzf public/system-pages-data.tar.gz -C public
          rm public/system-pages-data.tar.gz
      - name: Verify read-only data
        run: npm run test:system-public
      - name: Build static application
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
