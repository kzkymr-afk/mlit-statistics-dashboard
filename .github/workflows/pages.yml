name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "e-StatのExcelを再取得してDBを更新する"
        required: false
        default: false
        type: boolean
  schedule:
    # 毎週火曜 05:23 JST（月曜 20:23 UTC）
    - cron: "23 20 * * 1"

concurrency:
  group: publish-mlit-statistics
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 大型Excelの変換はUbuntuのnode:sqliteで異常終了するため、
  # ローカルと同系統のmacOSランナーで週次更新する。
  refresh:
    if: github.event_name == 'schedule' || inputs.refresh_data == true
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Refresh the e-Stat API inventory when configured
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: npm run sync:estat-api
      - name: Refresh official Excel sources
        run: |
          npm run sync:building-annual
          npm run sync:orders-major50-annual
      - name: Build the database and static data
        run: |
          npm run db:build-local
          npm run data:export-pages
          npm run test:data
      - name: Save the current database and Pages data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/exports
          gzip -c data/database/mlit-statistics.sqlite > data/database/mlit-statistics.sqlite.gz
          tar -cf data/exports/pages-data.tar -C public data
          if gh release view data-current >/dev/null 2>&1; then
            gh release upload data-current \
              data/database/mlit-statistics.sqlite.gz \
              data/exports/pages-data.tar \
              --clobber
          else
            gh release create data-current \
              data/database/mlit-statistics.sqlite.gz \
              data/exports/pages-data.tar \
              --title "Current normalized data" \
              --notes "GitHub Pages公開用の最新正規化データです。"
          fi

  build:
    needs: [refresh]
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Download prepared Pages data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public
          gh release download data-current \
            --pattern 'pages-data.tar' \
            --dir public
          tar -xf public/pages-data.tar -C public
          rm public/pages-data.tar
      - name: Verify read-only data
        run: npm run test:data
      - name: Build static application
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    if: always() && needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
